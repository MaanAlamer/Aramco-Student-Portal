<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>إنشاء حساب جديد | أكاديمية التقدّم</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/logoAA-removebg-preview.png') }}">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #020617;
            color: #f9fafb;
        }

        .register-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .register-card {
            width: 100%;
            max-width: 1150px;
            background: #020617;
            border-radius: 32px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.9);
            display: flex;
            overflow: hidden;
        }

        .register-panel {
            padding: 40px 50px;
            box-sizing: border-box;
        }

        /* القسم الأيسر - النموذج (mirrored from login) */
        .register-left {
            flex: 1;
            background: #020617;
        }

        /* القسم الأيمن - الشعار (mirrored from login) */
        .register-right {
            flex: 1;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 35%, #4338ca 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
        }

        .register-title {
            font-size: 32px;
            margin: 0 0 8px;
            text-align: center;
        }

        .register-subtitle {
            font-size: 16px;
            color: #9ca3af;
            text-align: center;
            margin: 0 0 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #e5e7eb;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 14px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #f9fafb;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.7);
        }

        .btn-primary,
        .btn-outline,
        .btn-ghost {
            width: 100%;
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .btn-primary {
            border: none;
            background: linear-gradient(90deg, #4f46e5, #6366f1);
            color: #f9fafb;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.6);
            color: #f9fafb;
        }

        .btn-ghost {
            max-width: 420px;
            background: transparent;
            border: 1px solid rgba(226, 232, 240, 0.8);
            color: #f9fafb;
        }

        .register-logo {
            width: 220px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(15, 23, 42, 0.9));
        }

        .register-footer {
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            color: #9ca3af;
        }

        .register-footer a {
            color: #a5b4fc;
            text-decoration: none;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .info {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        @media (max-width: 960px) {
            .register-card {
                flex-direction: column;
                max-width: 480px;
            }

            .register-panel {
                padding: 28px 24px;
            }

            .register-right {
                order: -1;
            }
        }
    </style>
</head>
<body>
<section class="register-wrapper">
  <div class="register-card">
    <!-- القسم الأيسر: نموذج إنشاء الحساب -->
    <div class="register-panel register-left">
      <h1 class="register-title">إنشاء حساب جديد</h1>
      <p class="register-subtitle">قم بإنشاء حساب للوصول إلى النظام</p>

      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      {% if info %}<div class="info">{{ info }}</div>{% endif %}

      <form id="registerForm" method="post" action="{{ url_for('register_student') }}">
        <input type="hidden" name="mode" value="register">
        
        <div class="form-group">
          <label class="form-label">الاسم الكامل</label>
          <input type="text" class="form-input" name="full_name" 
                 placeholder="ادخل اسمك الكامل" required />
        </div>

        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-input" name="email" 
                 placeholder="example@gmail.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">رقم الهوية / السجل المدني</label>
          <input type="text" class="form-input" name="identity" 
                 placeholder="1xxxxxxxxx" pattern="[0-9]{8,12}" required />
        </div>

        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" class="form-input" name="password" 
                 placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label class="form-label">تأكيد كلمة المرور</label>
          <input type="password" class="form-input" name="password2" 
                 placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-primary">إنشاء الحساب</button>

        <p class="register-footer">
          لديك حساب بالفعل؟
          <a href="{{ url_for('login') }}">تسجيل الدخول</a>
        </p>
      </form>
    </div>

    <!-- القسم الأيمن: الشعار والزر -->
    <div class="register-panel register-right">
    <img src="{{ url_for('static', filename='assets/logoAA-removebg-preview.png') }}" alt="Advantage Academy" class="register-logo" />
      <button type="button" class="btn-ghost" onclick="goToLogin()">
        العودة إلى تسجيل الدخول
      </button>
    </div>
  </div>
</section>

<script>
    function goToLogin() {
        window.location.href = "{{ url_for('login') }}";
    }

    // Form validation
    const registerForm = document.getElementById('registerForm');
    if (registerForm) {
        registerForm.addEventListener('submit', function(e) {
            const password = document.querySelector('input[name="password"]').value;
            const password2 = document.querySelector('input[name="password2"]').value;
            
            if (password !== password2) {
                e.preventDefault();
                alert('كلمات المرور غير متطابقة');
            }
        });
    }
</script>
</body>
</html>
