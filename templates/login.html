<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>أكاديمية التقدّم | Advantage Academy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/logoAA-removebg-preview.png') }}">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #020617;
            color: #f9fafb;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .login-card {
            width: 100%;
            max-width: 1150px;
            background: #020617;
            border-radius: 100px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.9);
            display: flex;
            overflow: hidden;
        }

        .login-panel {
            padding: 40px 50px;
            box-sizing: border-box;
        }

        .login-left {
            flex: 1;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-right {
            flex: 1;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 35%, #4338ca 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
        }

        .demo-entry {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 20px;
        }

        .login-title {
            font-size: 32px;
            margin: 0 0 8px;
            text-align: center;
        }

        .login-subtitle {
            font-size: 16px;
            color: #9ca3af;
            text-align: center;
            margin: 0 0 12px;
            line-height: 1.6;
        }

        .demo-note {
            font-size: 13px;
            color: #6b7280;
            text-align: center;
            margin: 0 0 8px;
        }

        .btn-demo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 64px;
            padding: 20px 28px;
            border-radius: 999px;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        .btn-demo:hover {
            transform: translateY(-2px);
        }

        .btn-demo-student {
            background: linear-gradient(90deg, #4f46e5, #6366f1);
            color: #f9fafb;
            box-shadow: 0 14px 40px rgba(79, 70, 229, 0.45);
        }

        .btn-demo-student:hover {
            box-shadow: 0 18px 48px rgba(79, 70, 229, 0.55);
        }

        .btn-demo-coordinator {
            background: transparent;
            color: #f9fafb;
            border: 2px solid rgba(148, 163, 184, 0.65);
        }

        .btn-demo-coordinator:hover {
            border-color: #a5b4fc;
            box-shadow: 0 12px 36px rgba(148, 163, 184, 0.2);
        }

        .login-logo {
            width: 220px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(15, 23, 42, 0.9));
        }

        .btn-ghost {
            max-width: 420px;
            width: 100%;
            padding: 12px 18px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            background: transparent;
            border: 1px solid rgba(226, 232, 240, 0.8);
            color: #f9fafb;
            cursor: default;
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            text-align: center;
        }

        @media (max-width: 960px) {
            .login-card {
                flex-direction: column;
                max-width: 480px;
                border-radius: 32px;
            }

            .login-panel {
                padding: 28px 24px;
            }

            .login-right {
                order: -1;
            }

            .btn-demo {
                font-size: 18px;
                min-height: 56px;
                padding: 16px 22px;
            }
        }
    </style>
</head>
<body>
<section class="login-wrapper">
  <div class="login-card">
    <div class="login-panel login-left">
      <div class="demo-entry">
        <h1 class="login-title">أكاديمية التقدّم</h1>
        <p class="login-subtitle">استكشف المنصة مباشرة — وضع العرض التجريبي</p>
        <p class="demo-note">اختر نوع الحساب للانتقال إلى لوحة التحكم</p>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}

        <a href="{{ url_for('login', enter='student') }}" class="btn-demo btn-demo-student">
          الدخول كطالب
        </a>
        <a href="{{ url_for('login', enter='coordinator') }}" class="btn-demo btn-demo-coordinator">
          الدخول كمشرف
        </a>
      </div>
    </div>

    <div class="login-panel login-right">
      <img src="{{ url_for('static', filename='assets/logoAA-removebg-preview.png') }}" alt="Advantage Academy" class="login-logo" />
      <button type="button" class="btn-ghost">
        مرحباً بك في أكاديمية التقدم
      </button>
    </div>
  </div>
</section>
</body>
</html>
